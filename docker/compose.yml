services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tjlightrag
      POSTGRES_USER: tjlightrag
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tjlightrag -d tjlightrag"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: tjlightrag:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/tjlightrag
      DB_USERNAME: tjlightrag
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
