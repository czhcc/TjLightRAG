services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    entrypoint: ["bash", "/opt/tjlightrag-db-start.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: tjlightrag
      POSTGRES_USER: tjlightrag
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/opt/tjlightrag-init:ro
      - ./db-entrypoint.sh:/opt/tjlightrag-db-start.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tjlightrag -d tjlightrag"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: tjlightrag:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RAG_RETRIEVAL_MAX_CONCURRENCY: ${RAG_RETRIEVAL_MAX_CONCURRENCY:-4}
      RAG_RETRIEVAL_TIMEOUT_SECONDS: ${RAG_RETRIEVAL_TIMEOUT_SECONDS:-120}
      RAG_MODEL_MASTER_KEY: ${RAG_MODEL_MASTER_KEY:-}
      RAG_MODEL_ALLOWED_HOSTS: ${RAG_MODEL_ALLOWED_HOSTS:-}
      RAG_MODEL_ALLOW_HTTP: ${RAG_MODEL_ALLOW_HTTP:-false}
      DB_URL: jdbc:postgresql://db:5432/tjlightrag
      DB_USERNAME: tjlightrag_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_MIGRATION_USERNAME: tjlightrag
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
      RAG_VECTOR_DIMENSIONS: ${RAG_VECTOR_DIMENSIONS:?Set RAG_VECTOR_DIMENSIONS}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:?Set RAG_EMBEDDING_MODEL}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
