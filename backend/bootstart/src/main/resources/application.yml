spring:
  application:
    name: tj-lightrag
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/callback
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

# Provider SDK diagnostics may contain prompts or provider payloads.
logging:
  level:
    org.springframework.ai.openai: "OFF"
    org.springframework.ai.chat.model.MessageAggregator: "OFF"

rag:
  models:
    master-key: ${RAG_MODEL_MASTER_KEY:}
  retrieval:
    max-concurrency: ${RAG_RETRIEVAL_MAX_CONCURRENCY:4}
    timeout-seconds: ${RAG_RETRIEVAL_TIMEOUT_SECONDS:120}
  query:
    max-concurrency: ${RAG_QUERY_MAX_CONCURRENCY:4}
    timeout-seconds: ${RAG_QUERY_TIMEOUT_SECONDS:180}
