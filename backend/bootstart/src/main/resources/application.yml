spring:
  application:
    name: tj-lightrag
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/callback
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

rag:
  models:
    master-key: ${RAG_MODEL_MASTER_KEY:}
    allowed-hosts: ${RAG_MODEL_ALLOWED_HOSTS:}
    allow-http: ${RAG_MODEL_ALLOW_HTTP:false}
